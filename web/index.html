<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>imagegen studio</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header>
  <div class="brand">imagegen <span>studio</span></div>
  <div class="header-info">
    <select id="profile-select" title="当前配置"></select>
    <span id="library-path" class="muted"></span>
  </div>
</header>

<main>
  <section id="generator">
    <h2>生成</h2>
    <div class="tabs">
      <button class="tab on" data-mode="t2i" type="button">文生图</button>
      <button class="tab" data-mode="i2i" type="button">图生图</button>
    </div>
    <textarea id="prompt" rows="5" placeholder="描述你想要的图片，一句中文口语也可以——我会先润色再生成。直接粘贴完整提示词则原样使用。"></textarea>
    <div id="edit-panel" class="hidden">
      <label class="file-label">参考图（1-4 张，可从图库「用作参考」带入）
        <input id="ref-files" type="file" accept="image/*" multiple>
      </label>
      <div id="ref-thumbs" class="ref-thumbs"></div>
    </div>
    <div class="field-row">
      <label>模型
        <select id="model"><option value="">默认 gpt-image-2</option></select>
      </label>
      <label>预设
        <select id="preset">
          <option value="">不指定</option>
          <option value="fast">fast 草稿</option>
          <option value="standard">standard 日常</option>
          <option value="quality" selected>quality 精出</option>
          <option value="square-2k">square-2k</option>
          <option value="landscape-2k">landscape-2k 横</option>
          <option value="portrait-2k">portrait-2k 竖</option>
          <option value="transparent">transparent 透明底</option>
        </select>
      </label>
      <label>张数
        <select id="n">
          <option value="1" selected>1</option>
          <option value="2">2</option>
          <option value="3">3</option>
          <option value="4">4</option>
        </select>
      </label>
    </div>
    <details class="advanced">
      <summary>自定义尺寸 / 高级（覆盖预设）</summary>
      <div class="field-row">
        <label>尺寸（如 1536x1024）<input id="size" placeholder="留空用预设"></label>
        <label>质量<input id="quality" placeholder="low / medium / high"></label>
        <label>格式<input id="format" placeholder="png / webp"></label>
      </div>
    </details>
    <details class="advanced">
      <summary>网关配置（多 profile 切换）</summary>
      <div id="profiles-list"></div>
      <form id="profile-form" class="field-row">
        <label>名称<input id="pf-name" placeholder="如 apiclaw" required></label>
        <label>Base URL<input id="pf-url" placeholder="https://.../v1" required></label>
        <label>API Key<input id="pf-key" type="password" placeholder="留空 = 保留原 key"></label>
        <button type="submit">保存</button>
      </form>
      <p class="muted">key 只存在本机服务端配置文件里，页面永不回传。</p>
    </details>
    <button id="generate-btn" type="button">生成</button>
    <div id="job-status" class="hidden">
      <span class="spinner"></span><span id="job-text">排队中…</span>
    </div>
    <div id="latest"></div>
  </section>

  <section id="library">
    <h2>图库</h2>
    <div class="filter-row">
      <input id="search" placeholder="搜索提示词…">
      <select id="filter-model"><option value="">全部模型</option></select>
      <label class="check"><input type="checkbox" id="fav-only"> 只看收藏</label>
      <button id="refresh" type="button" title="重新扫描">↻</button>
    </div>
    <div id="gallery" class="gallery"></div>
    <div id="empty-hint" class="muted hidden">还没有图片——生成第一张吧。</div>
  </section>
</main>

<aside id="detail" class="hidden">
  <button id="close-detail" type="button" class="icon-btn">✕</button>
  <img id="detail-img" alt="">
  <div class="detail-body">
    <div id="detail-stars" class="stars" title="点击评分"></div>
    <p id="detail-prompt"></p>
    <table id="detail-params"></table>
    <div class="detail-actions">
      <button id="copy-cmd" type="button">复制复现命令</button>
      <button id="open-folder" type="button">打开文件夹</button>
      <button id="use-as-variant" type="button">以此发起变体</button>
      <button id="use-as-reference" type="button">用作图生图参考</button>
    </div>
    <div id="copy-hint" class="muted hidden">已复制到剪贴板</div>
  </div>
</aside>

<script src="/app.js"></script>
</body>
</html>
