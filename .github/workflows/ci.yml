name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUTF8: "1"
  IMAGE_GEN_CLI: ${{ github.workspace }}/image-gen/scripts/image_gen.py

jobs:
  test:
    name: test (${{ matrix.os }}, ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.10"
          - os: ubuntu-latest
            python: "3.13"
          - os: windows-latest
            python: "3.11"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: xinghe-labs/image-gen
          path: image-gen
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install requirements
        run: python -m pip install -r requirements.txt
      - name: Install Playwright for UI smoke tests (Linux)
        if: runner.os == 'Linux'
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Install Playwright for UI smoke tests (Windows)
        if: runner.os == 'Windows'
        run: |
          python -m pip install playwright
          python -m playwright install chromium
      - name: Compile
        run: python -m py_compile scripts/imagegen_server.py
      - name: Offline test suite
        run: python -m unittest discover -s tests -p "test_*.py"
